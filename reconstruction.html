
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech Reconstruction</title>
  <style>
    html, body { margin: 0; padding: 0; }
    iframe { width: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="demo" src="index.html" title="Speech Reconstruction Demo"></iframe>

  <script>
    const frame = document.getElementById("demo");

    frame.onload = function () {
      const doc = frame.contentDocument;
      const sections = doc.querySelectorAll(
        "main article > .container.pt-5.mt-5.shadow.p-5.mb-5.bg-white.rounded"
      );

      sections.forEach(function (section) {
        const heading = section.querySelector("h3");
        if (!heading ||
            heading.textContent.trim() !== "Speech Reconstruction:") {
          section.style.display = "none";
        }
      });

      frame.style.height = (doc.body.scrollHeight + 30) + "px";
    };
  </script>
</body>
</html>
